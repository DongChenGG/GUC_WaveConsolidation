name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract source archive
        shell: pwsh
        run: Expand-Archive -Path WMS-Wave-Assistant-source.zip -DestinationPath source
      - name: Install build dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build single EXE and test bundled Chromium
        working-directory: source
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: WMS-Wave-Assistant-Windows-x64
          path: |
            source/dist/WMS-Wave-Assistant.exe
            source/dist/WMS-Wave-Assistant.exe.sha256
            source/dist/WMS-Wave-Assistant.build.json
          if-no-files-found: error
          retention-days: 7
