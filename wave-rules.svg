<rect x="25" y="1588.5" width="265" height="48" rx="10" fill="#0f172a"/>
<text x="38" y="1618.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">共用执行规则</text>
<rect x="325" y="306.0" width="265" height="48" rx="10" fill="#0369a1"/>
<text x="338" y="336.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">正常区域顺序</text>
<rect x="625" y="36.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="66.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">1 Ground</text>
<rect x="925" y="36.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="66.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">TTGround，整区</text>
<rect x="625" y="119.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="144.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">2 Pallet L，3</text>
<text x="638" y="167.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Pallet H</text>
<rect x="925" y="126.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="156.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">124–130，巷道留空，虚拟区整选</text>
<rect x="625" y="351.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="381.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">4 Box L，5 Box H</text>
<rect x="925" y="216.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="246.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">131–178，先查整区</text>
<rect x="925" y="306.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="336.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">数量多时估算巷道分组</text>
<rect x="925" y="396.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="426.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">局部不足时成倍扩展</text>
<rect x="925" y="486.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="516.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">到边界仍不足则暂留</text>
<rect x="625" y="576.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="606.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">6 Bin L，7 Bin H</text>
<rect x="925" y="576.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="606.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">179–191，巷道留空，虚拟区整选</text>
<rect x="325" y="891.0" width="265" height="48" rx="10" fill="#0369a1"/>
<text x="338" y="921.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">条件交集</text>
<rect x="625" y="659.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="684.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Zone Info 使用</text>
<text x="638" y="707.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Include</text>
<rect x="625" y="749.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="774.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">单一虚拟区使用 Totally</text>
<text x="638" y="797.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">included</text>
<rect x="625" y="846.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="876.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">混区虚拟区使用 Include</text>
<rect x="625" y="929.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="954.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">130–131 用 Pallet 或</text>
<text x="638" y="977.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Box 虚拟区区分</text>
<rect x="625" y="1019.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="1044.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">178–179 用 Box 或</text>
<text x="638" y="1067.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Bin 虚拟区区分</text>
<rect x="625" y="1116.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1146.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">完整巷道同时选择头段和尾段</text>
<rect x="325" y="1341.0" width="265" height="48" rx="10" fill="#0369a1"/>
<text x="338" y="1371.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Multis 混区</text>
<rect x="625" y="1199.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="1224.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Pallet 加 Box，L/H</text>
<text x="638" y="1247.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">分开</text>
<rect x="625" y="1296.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1326.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Box 加 Bin，L/H 分开</text>
<rect x="625" y="1386.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1416.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">全货架混区，L/H 分开</text>
<rect x="625" y="1476.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1506.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">地堆加货架混区，L/H 分开</text>
<rect x="325" y="1746.0" width="265" height="48" rx="10" fill="#0369a1"/>
<text x="338" y="1776.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">数量与兜底</text>
<rect x="625" y="1559.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="1584.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Search 后 Total</text>
<text x="638" y="1607.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">package 决定是否提交</text>
<rect x="625" y="1656.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1686.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">正常释放至少 30 包，可设置更高</text>
<rect x="625" y="1746.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1776.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">暂存隔离不受 30 包限制</text>
<rect x="625" y="1926.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="1956.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">全仓兜底清除区域、巷道与高低位限制</text>
<rect x="925" y="1836.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="1866.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">保留类别、策略和当前数量范围</text>
<rect x="925" y="1926.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="1956.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">仍受释放门槛及首波爆品剩余额度约束</text>
<rect x="925" y="2016.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="2046.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">每类一次，不无限追赶新订单</text>
<rect x="325" y="2308.5" width="265" height="48" rx="10" fill="#0369a1"/>
<text x="338" y="2338.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">每批执行</text>
<rect x="625" y="2106.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="2136.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">设置筛选并 Search</text>
<rect x="625" y="2189.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="2214.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">Consolidate Wave</text>
<text x="638" y="2237.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">与前置 OK</text>
<rect x="625" y="2279.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="2304.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">选择 picking</text>
<text x="638" y="2327.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">strategy</text>
<rect x="625" y="2369.0" width="265" height="62" rx="10" fill="#0f766e"/>
<text x="638" y="2394.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">选择 Not Operated</text>
<text x="638" y="2417.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">并点击最终 OK</text>
<rect x="625" y="2511.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="2541.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">等待新增 wave 回执后继续</text>
<rect x="925" y="2466.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="2496.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">数量差异只记录，不因不相等而暂停</text>
<rect x="925" y="2556.0" width="265" height="48" rx="10" fill="#475569"/>
<text x="938" y="2586.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">提交结果不明确时暂停，避免重复提交</text>
<rect x="325" y="2871.0" width="265" height="48" rx="10" fill="#0369a1"/>
<text x="338" y="2901.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">使用与恢复</text>
<rect x="625" y="2646.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="2676.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">WMS 必须切换 English</text>
<rect x="625" y="2736.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="2766.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">助手支持中文和西语</text>
<rect x="625" y="2826.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="2856.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">默认不按查询次数频繁刷新</text>
<rect x="625" y="2916.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="2946.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">查询超时有限重试，保留登录信息</text>
<rect x="625" y="3006.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="3036.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">重新开始建立新任务，保留台账</text>
<rect x="625" y="3096.0" width="265" height="48" rx="10" fill="#0f766e"/>
<text x="638" y="3126.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="white">继续上次任务沿用原计划和大阶段进度</text>
</svg>